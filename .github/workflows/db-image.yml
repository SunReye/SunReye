---
name: Docker · database image

# The ONE database image: ghcr.io/sunreye/timescaledb:pg17-ts<version>.
#
# It has to be published rather than built where it is used, because a GitHub
# Actions `services:` block cannot build an image inline — and three workflows
# (ci.yml, db-restore.yml, db-weighted-rollups.yml) plus all three compose files
# consume it. scripts/storage-tuning.ts asserts every one of them names the tag
# this workflow pushes.
#
# The tag is derived from the Dockerfile's own ARG, so the pin lives in exactly
# one place: bump ARG TIMESCALEDB_VERSION there, and this pushes the matching
# tag. Nothing here is triggered by a release — the image only changes when its
# own Dockerfile does.
on:
  push:
    branches: [master, dev]
    paths:
      - "docker/timescaledb/**"
      - ".github/workflows/db-image.yml"
  pull_request:
    paths:
      - "docker/timescaledb/**"
      - ".github/workflows/db-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: db-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sunreye/timescaledb

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One source of truth for the version: the Dockerfile's pin. A tag typed
      # by hand here could disagree with what the image actually installs.
      - name: Resolve the pinned TimescaleDB version
        id: pin
        run: |
          version="$(sed -nE 's/^ARG TIMESCALEDB_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/timescaledb/Dockerfile)"
          if [ -z "$version" ]; then
            echo "docker/timescaledb/Dockerfile has no full-patch ARG TIMESCALEDB_VERSION" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=pg17-ts${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # A pull_request run only proves the image builds; it must not push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 is what CI runs on; arm64 is what the addon's Pi users run, and a
      # dev box on Apple silicon. Both are cheap here — the layer is one apt-get.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docker/timescaledb
          file: docker/timescaledb/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.pin.outputs.tag }}
          cache-from: type=gha,scope=db-image
          cache-to: type=gha,mode=max,scope=db-image
          provenance: false

      # The tag is immutable in practice (a bump changes the version), so prove
      # the pushed image really carries what the schema needs rather than
      # trusting the build. Runs the amd64 image the runner just pushed.
      - name: Verify the extension and the toolkit
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name dbimage -e POSTGRES_PASSWORD=verify \
            "${IMAGE}:${{ steps.pin.outputs.tag }}"
          for _ in $(seq 1 30); do
            docker exec dbimage pg_isready -U postgres -q && break
            sleep 2
          done
          docker exec dbimage psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb;" \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb_toolkit;" \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb';" \
            -c "SELECT average(time_weight('LOCF', t, v)) FROM (VALUES (now(), 1.0), (now() + interval '1 hour', 3.0)) AS s(t, v);" \
            -c "SELECT delta(counter_agg(t, v)) FROM (VALUES (now(), 10.0), (now() + interval '1 hour', 25.0)) AS s(t, v);"
          docker exec dbimage psql -U postgres -tAc \
            "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb';" \
            | grep -qx "${{ steps.pin.outputs.version }}"
          docker rm -f dbimage
