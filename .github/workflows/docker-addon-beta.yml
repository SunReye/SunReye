---
name: Docker · addon beta

# Beta channel for the Home Assistant addon: every push to `dev` builds one
# amd64 image and offers it to the `sunreye-beta` store entry, so unreleased
# work can be tried on a real HA before the release PR lands on master.
#
# Only the addon image is built here (not server/web/migrate) and only amd64 —
# aarch64 needs QEMU emulation and would dominate the run time.
#
# Two-step, same ordering rule as docker-addon.yml: the image is pushed first,
# and only then does `publish` advance the version the Supervisor reads. The
# Supervisor pulls `<image>:<version>`, so naming a version whose tag does not
# exist yet turns the addon's Update button into a pull failure.
#
# Versions are `beta.<YYYYMMDD>-<short sha>`, the scheme evcc uses for its own
# nightly addon (evcc-io/evcc .github/workflows/nightly.yml). Deliberately NOT
# semver: a beta cannot know whether the release it leads to will be a major, a
# minor, or a patch, and any guess is a version string that lies. The date plus
# the commit says exactly what this image is instead.
#
# Ordering does not matter here, which is what makes the scheme safe. The
# Supervisor offers an update on `self.version != self.latest_version` (see
# need_update in supervisor/apps/app.py), so a differing version is enough —
# and because the beta is its own slug, its versions are only ever compared
# with other betas anyway.
#
# Runs on `dev`, but can be dispatched against ANY branch to try one feature on
# real hardware before integrating it — the beta store entry then serves that
# branch's image until the next `dev` push takes it back. The version's sha
# identifies which commit it came from, and the publish commit names the branch.
on:
  push:
    branches: [dev]
    # Nothing here reaches the image or the addon manifest, and a beta build
    # costs ~10 minutes. `sunreye/**` is deliberately NOT ignored: its DOCS.md
    # and config.yaml are copied into the beta manifest.
    paths-ignore:
      - "apps/docs/**"
      - "plans/**"
      - ".claude/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "TODO.md"
      - "DEVTOOLS.md"
  workflow_dispatch:
  # Daily aarch64 build-only check (see the `arm-check` job) — the per-push beta
  # is amd64, so ARM-only breakage would otherwise surface at release.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  packages: write

# A newer push to `dev` supersedes an in-flight beta — the older image would
# only be published as a version nobody wants to install. Keyed by event so the
# nightly ARM check can never cancel a beta that someone is waiting on.
concurrency:
  group: docker-addon-beta-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push (amd64)
    # The nightly schedule exists only for arm-check; it must not publish a beta
    # that nobody asked for.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Date + commit, so the version names the code it contains rather than a
      # release number nobody can know yet.
      - name: Resolve beta version
        id: v
        run: |
          short_sha=$(echo "${{ github.sha }}" | cut -c 1-7)
          echo "version=beta.$(date -u +%Y%m%d)-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve base image
        id: base
        run: echo "build_from=$(yq -r '.build_from.amd64' sunreye/build.yaml)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (the repository is mixed
      # case, GHCR is not). The beta shares the stable addon's image
      # repository — only the tag distinguishes them.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-addon-amd64
          # The immutable tag is what the Supervisor pulls; the moving `beta`
          # tag is for docker-compose users who just want "latest beta" (evcc
          # publishes its `nightly` pair the same way). No separate short-sha
          # tag — the version already carries the sha.
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=beta

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sunreye/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.v.outputs.version }}
          # Seeded from the stable amd64 cache so the first beta after a
          # release is not a cold build, but written to its own scope so beta
          # layers never evict the release build's cache.
          cache-from: |
            type=gha,scope=addon-beta-amd64
            type=gha,scope=addon-amd64
          cache-to: type=gha,mode=max,scope=addon-beta-amd64
          provenance: false

  # The image exists now, so the store entry can point at it. sunreye-beta/
  # must be committed on master because the Supervisor only ever reads an addon
  # repository's default branch — it cannot be pointed at `dev`.
  publish:
    name: Publish version to master
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Generate from `dev`'s stable manifest, not master's: the beta image
      # ships dev's option schema, and a manifest describing the last
      # release's options would drop any option added since.
      - name: Take the source manifest from dev
        run: git restore --source=${{ github.sha }} -- sunreye/

      - name: Sync sunreye-beta/
        run: node scripts/sync-beta-addon.mjs --version=${{ needs.build.outputs.version }}

      - name: Restore master's stable manifest
        run: git restore --source=HEAD -- sunreye/

      # After the restore, so the released history comes from master's
      # changelog — that is the authoritative one, and dev may not have had a
      # release merged back into it yet. The unreleased section is read from
      # git, so it still describes dev.
      - name: Write the beta changelog
        run: |
          node scripts/beta-changelog.mjs \
            --version=${{ needs.build.outputs.version }} \
            --head=${{ github.sha }}

      # `chore` so release-please never treats a beta as releasable work, and
      # [skip ci] because only generated files under sunreye-beta/ changed. The
      # source ref is named in the subject so master's history says which branch
      # each beta came from — betas can be dispatched from any branch, not just
      # `dev`.
      #
      # Rebases before pushing: master can advance between this job's checkout
      # and its push (another merge, or a release), and a rejected push would
      # fail the beta after its image was already built and tagged. Only
      # generated files under sunreye-beta/ are involved, so a rebase is safe.
      - name: Commit to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- sunreye-beta; then
            echo "sunreye-beta/ already current — nothing to publish"
            exit 0
          fi
          git add sunreye-beta
          git commit -m "chore(addon-beta): publish ${{ needs.build.outputs.version }} from ${{ github.ref_name }} [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase --quiet origin master || {
              echo "rebase onto master failed"
              exit 1
            }
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "push rejected (master moved) — retrying ($attempt/3)"
          done
          echo "could not publish the manifest after 3 attempts"
          exit 1

      - name: Summary
        run: |
          echo "Beta \`${{ needs.build.outputs.version }}\` is live, built from \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "In Home Assistant: Settings → Add-ons → SunReye (beta) → Update." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If the store still shows the old version, ⋮ → Check for updates." >> "$GITHUB_STEP_SUMMARY"

  # One immutable image per push to `dev` would otherwise pile up in GHCR
  # forever, so keep only the newest few (evcc prunes its `nightly.*` tags the
  # same way). Runs after `publish` so the version the manifest now names is
  # always among the survivors.
  #
  # Never fatal: a pruning failure must not turn a successful beta red, and
  # deleting package versions is the one step whose permissions may need a PAT
  # rather than GITHUB_TOKEN.
  prune:
    name: Prune superseded beta tags
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: sunreye-addon-amd64
      KEEP: "3"
    steps:
      - name: Delete all but the newest beta.* versions
        run: |
          owner='${{ github.repository_owner }}'

          # The packages API is owner-type specific and the repository owner may
          # be either, so try both rather than hardcoding one. Keep gh out of a
          # pipeline here — piping would test jq's exit status, not gh's, and
          # the fallback would never fire.
          found=""
          for scope in orgs users; do
            if gh api "/$scope/$owner/packages/container/$PACKAGE/versions" \
                 --paginate > raw.json 2>/dev/null; then
              found="$scope"
              echo "listed versions via /$scope/$owner"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "could not list package versions — skipping prune"
            exit 0
          fi

          # --paginate emits one array per page; slurp them into a flat list.
          jq -s 'add' raw.json > versions.json

          # Only versions whose tags are ALL beta.* are eligible: a digest that
          # also carries `latest` or a release tag is shared with a release
          # build, and deleting it would break the stable addon. This also
          # protects the current beta for free — it still carries the moving
          # `beta` tag, which is not a `beta.` match.
          ids=$(jq -r --argjson keep "$KEEP" '
            [ .[]
              | select((.metadata.container.tags | length) > 0)
              | select(all(.metadata.container.tags[]; startswith("beta.")))
            ]
            | sort_by(.created_at) | reverse | .[$keep:] | .[].id
          ' versions.json) || ids=""

          if [ -z "$ids" ]; then
            echo "nothing to prune"
            exit 0
          fi

          for id in $ids; do
            echo "deleting version $id"
            gh api -X DELETE "/$found/$owner/packages/container/$PACKAGE/versions/$id" || \
              echo "  could not delete $id (a PAT with delete:packages may be needed)"
          done

  # Betas are amd64, so an aarch64-only break — a native module that has no ARM
  # prebuild, a base image that diverges — would stay invisible until the
  # release build compiles every arch. This builds dev for aarch64 once a day
  # purely to find that out, and pushes nothing: the beta store entry stays
  # amd64-only, and this exists to go red, not to ship.
  arm-check:
    name: aarch64 build check (no push)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs are always dispatched against the default branch, so
      # `dev` has to be requested explicitly.
      - uses: actions/checkout@v4
        with:
          ref: dev

      # Same guard as docker-addon.yml's nightly: emulated ARM builds are slow,
      # so don't spend one re-proving an unchanged branch.
      - name: Skip when dev has not moved in 24h
        id: check
        run: |
          if [ "$(git log -1 --format=%ct)" -ge "$(( $(date +%s) - 86400 ))" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "no commits on dev since the last check — skipping"
          fi

      - name: Resolve base image
        if: steps.check.outputs.build == 'true'
        id: base
        run: echo "build_from=$(yq -r '.build_from.aarch64' sunreye/build.yaml)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build only
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sunreye/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
            BUILD_ARCH=aarch64
            BUILD_VERSION=arm-check
          # Shares the release build's aarch64 cache, which is the only other
          # place ARM layers are produced.
          cache-from: type=gha,scope=addon-aarch64
          cache-to: type=gha,mode=max,scope=addon-aarch64
          provenance: false
