---
name: Upgrade test

# Proves the upgrade path end-to-end before it reaches a user: boot the last
# published release, let it collect data, swap in freshly built images, and
# assert the migration runner (baseline stamping included — the old release is
# still push-shaped or journaled at an older point) preserves the data and the
# server comes back healthy.
on:
  pull_request:
    paths:
      - "packages/db/**"
      - "docker/**"
      - "apps/server/**"
      - "sunreye/**"
      - ".github/workflows/upgrade-test.yml"
  push:
    tags: ["server-v*", "addon-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: upgrade-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-upgrade:
    name: Compose upgrade (latest → this build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    env:
      POSTGRES_PASSWORD: upgrade-test
    steps:
      # fetch-depth: 0 — the pre-upgrade schema is shaped by checking out the
      # last released tag and running ITS migrator, so the tags and their history
      # have to be here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write server env
        run: |
          cat > .env <<'EOF'
          BETTER_AUTH_SECRET=upgrade-test-secret-0123456789abcdef
          INVERTER_SIMULATE=true
          EOF

      # THE PRE-UPGRADE DATABASE IS SHAPED FROM A TAG, NOT FROM A PUBLISHED IMAGE.
      #
      # It used to run `ghcr.io/sunreye/sunreye-migrate:latest`. That image was
      # retired when the server became one binary that migrates itself
      # (`command: ["migrate"]`), nothing publishes it any more, and the day its
      # tag was deleted from the registry this workflow started failing with
      # `manifest unknown` on every PR touching packages/db — a failure with no
      # visible connection to the packaging change that caused it. The published
      # *server* image cannot stand in for it either: at the last release the
      # image still compiled `src/index.ts` rather than the `src/main.ts` argv
      # dispatcher, so it ignores `migrate` and boots the SERVER instead, leaving
      # the database unshaped and the upgrade below proving nothing.
      #
      # Running the tag's own migrator removes the registry from the equation
      # entirely: the pre-upgrade schema is whatever that release's source says
      # it is, reproducibly, and no image needs to keep existing for this test to
      # work. `scripts/require-tests.ts`' sibling gate in
      # `scripts/packaging.test.ts` now fails if any workflow reaches for a
      # retired image again.
      #
      # The old *server* is still deliberately never started: its healthchecks
      # predate the compose file, and known-broken old binaries (e.g. the
      # serialport bundling regression) must not be able to fail the upgrade
      # test. Data is seeded directly instead of via the poll loop.
      - name: Shape a database with the last released schema
        run: |
          # The migrator below is a host-side `bun` process, not a container, so
          # it needs a published port. docker/docker-compose.yml deliberately
          # publishes none — the production stack keeps the database off the
          # host — and this override is CI's only reason to. Every later
          # override must carry it too (scripts/packaging.test.ts asserts that),
          # or the next `docker compose up` recreates postgres without it.
          cat > docker-compose.override.yml <<'EOF'
          services:
            postgres:
              ports:
                - "5432:5432"
          EOF
          SUNREYE_TAG=latest docker compose up -d --quiet-pull postgres
          for i in $(seq 1 60); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 2
          done

          # The newest addon release reachable from this ref — the version a user
          # is actually upgrading FROM.
          old_tag=$(git describe --tags --abbrev=0 --match 'addon-v*')
          echo "shaping the pre-upgrade database with $old_tag"
          echo "$old_tag" > /tmp/old-tag

          git worktree add /tmp/pre-upgrade "$old_tag"
          ( cd /tmp/pre-upgrade && bun install --frozen-lockfile )
          SKIP_ENV_VALIDATION=1 \
          DATABASE_URL="postgresql://postgres:$POSTGRES_PASSWORD@localhost:5432/SunReye" \
            bun run --cwd /tmp/pre-upgrade/packages/db db:migrate

          # The shaped database must be the OLD one: a text identity on
          # metrics_raw is what only 1.x has, and shaping it with the wrong tree
          # would make every assertion below vacuous.
          legacy=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT count(*) FROM information_schema.columns
              WHERE table_name = 'metrics_raw' AND column_name = 'inverter_id'")
          echo "pre-upgrade metrics_raw has a text identity: $legacy"
          [ "$legacy" = "1" ]

      # Days of data across several chunks, materialized into every rollup, and
      # then COMPRESSED. Compression is the part that matters: the operations an
      # upgrade performs on a compressed hypertable (adding a column, changing
      # `compress_segmentby`, recompressing existing batches) either work or
      # silently do nothing, and a 500-row seed inside the current chunk exercises
      # none of them. This step is what makes the assertions below evidence.
      - name: Seed metrics on the old schema, materialize and compress
        run: |
          docker compose exec -T postgres psql -U postgres -d SunReye -c \
            "INSERT INTO metrics_raw (time, inverter_id, metric, value)
             SELECT now() - (i || ' seconds')::interval, 'inv1', m,
                    CASE WHEN m = 'pv.power' THEN random()*5000 ELSE 230 + random() END
             FROM generate_series(1, 400000, 3) i,
                  unnest(ARRAY['pv.power','ac.l1.voltage','settings.workmode']) m"
          for view in minute_rollups hourly_rollups daily_rollups; do
            docker compose exec -T postgres psql -U postgres -d SunReye -c \
              "CALL refresh_continuous_aggregate('$view', NULL, NULL);"
          done
          # Compress only what is not compressed already, rather than calling
          # `compress_chunk(..., if_not_compressed => true)` over everything.
          # That flag is not the guard it looks like: it downgrades the newer
          # "already converted to columnstore" case to a NOTICE but still
          # ERRORs on "chunk ... is already compressed", and the published
          # release's own compression policy may have compressed a chunk before
          # this step runs. Skipping compressed chunks cannot hit either
          # wording. `show_chunks` is kept because it resolves a continuous
          # aggregate to its materialized hypertable, which
          # `chunks.hypertable_name` does not.
          compress_uncompressed() {
            docker compose exec -T postgres psql -U postgres -d SunReye -c \
              "SELECT compress_chunk(c) FROM $1 c
                WHERE NOT EXISTS (
                  SELECT 1 FROM timescaledb_information.chunks ch
                   WHERE format('%I.%I', ch.chunk_schema, ch.chunk_name)::regclass = c
                     AND ch.is_compressed)"
          }
          compress_uncompressed "show_chunks('metrics_raw', older_than => INTERVAL '2 hours')"
          compress_uncompressed "show_chunks('minute_rollups')"

          docker compose exec -T postgres psql -U postgres -d SunReye -tAc "SELECT count(*) FROM metrics_raw" | tee /tmp/rows-before
          [ "$(cat /tmp/rows-before)" -gt 0 ]

          # There must be something compressed to upgrade over, or the steps
          # above silently degraded into the old 500-row seed.
          compressed=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT count(*) FROM timescaledb_information.chunks WHERE is_compressed")
          echo "compressed chunks before upgrade: $compressed"
          [ "$compressed" -ge 2 ]

          # Per-rollup fingerprints: bucket count and the aggregate columns. Any
          # migration that re-materializes a bucket from raw it can no longer see
          # moves these.
          for view in minute_rollups hourly_rollups daily_rollups; do
            docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
              "SELECT count(*)||'|'||coalesce(round(avg(avg_value)::numeric,6),0)
                 FROM $view" > /tmp/$view-before
            echo "$view before: $(cat /tmp/$view-before)"
          done

      - name: Build this ref's images
        working-directory: .
        run: |
          docker build -f apps/server/Dockerfile -t sunreye-server:pr .

      - name: Upgrade in place
        run: |
          docker compose rm -f -s migrate
          SUNREYE_TAG=latest docker compose up -d --no-recreate postgres
          # Re-point both at the PR image without touching the volume — and
          # replace the shaping override above, so `migrate` goes back to the
          # compose file's `command: ["migrate"]` against the new dispatcher.
          cat > docker-compose.override.yml <<'EOF'
          services:
            postgres:
              ports:
                - "5432:5432"
            migrate:
              image: sunreye-server:pr
            server:
              image: sunreye-server:pr
          EOF
          SUNREYE_TAG=latest docker compose up -d server

      - name: Assert migration outcome
        run: |
          docker compose logs migrate
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = "0" ]

          # Baseline / journal: exactly the shipped migrations are recorded.
          shipped=$(ls ../packages/db/src/migrations/*.sql | wc -l)
          recorded=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc "SELECT count(*) FROM drizzle.__drizzle_migrations")
          echo "shipped=$shipped recorded=$recorded"
          [ "$recorded" = "$shipped" ]

          # Data survived.
          after=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc "SELECT count(*) FROM metrics_raw")
          echo "rows before=$(cat /tmp/rows-before) after=$after"
          [ "$after" -ge "$(cat /tmp/rows-before)" ]

          # No existing aggregate was re-materialized. Compared to 6 decimal
          # places rather than exactly: recompressing a chunk changes the order
          # doubles are summed in, which moves a sum of tens of millions in its
          # last bits and is not a data change.
          for view in minute_rollups hourly_rollups daily_rollups; do
            now=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
              "SELECT count(*)||'|'||coalesce(round(avg(avg_value)::numeric,6),0) FROM $view")
            echo "$view before=$(cat /tmp/$view-before) after=$now"
            [ "$now" = "$(cat /tmp/$view-before)" ]
          done

          # Every retention interval the shipped policy file declares reached the
          # database. `add_retention_policy(…, if_not_exists => TRUE)` is a NO-OP
          # where a policy already exists, so an interval change can be committed,
          # reported as applied, and never take effect on an upgraded system —
          # which is exactly what happened to the hourly tier once.
          docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT hypertable_name||'='||(config->>'drop_after')
               FROM timescaledb_information.jobs
              WHERE proc_name = 'policy_retention' ORDER BY 1" | tee /tmp/retention-after
          # `if`, not `[ -z … ] && continue`: the step runs under `bash -e`, where a
          # standalone `&&` list that evaluates false aborts the whole step.
          while read -r line; do
            target=${line%%=*}
            want=$(grep -oP "add_retention_policy\\('${target}', INTERVAL '\\K[^']+" \
              ../packages/db/src/timescale/policies.sql | tail -1)
            if [ -n "$want" ]; then
              echo "$target: db='${line#*=}' file='$want'"
              [ "${line#*=}" = "$want" ]
            fi
          done < /tmp/retention-after

          # The minute aggregates are FROZEN on an upgraded database, not merely
          # omitted for fresh installs. `policies.sql` states
          # `remove_continuous_aggregate_policy` for exactly this reason: leaving
          # the `add_` out would freeze a new install and leave every existing
          # deployment refreshing a tier raw now answers — and re-imposing that
          # tier's 90-day retention as the ceiling on raw's 1825.
          frozen=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT count(*) FROM timescaledb_information.jobs
              WHERE proc_name = 'policy_refresh_continuous_aggregate'
                AND hypertable_name IN ('minute_rollups','weighted_minute_rollups')")
          echo "minute refresh policies still armed after upgrade: $frozen"
          [ "$frozen" = "0" ]

          # …while the tiers that are still the long-horizon record keep theirs.
          live=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT count(*) FROM timescaledb_information.jobs
              WHERE proc_name = 'policy_refresh_continuous_aggregate'
                AND hypertable_name IN ('hourly_rollups','daily_rollups',
                                        'weighted_hourly_rollups','weighted_daily_rollups')")
          echo "live refresh policies: $live"
          [ "$live" = "4" ]

          # The weight column is present and NULL on every pre-upgrade row: that
          # NULL is what makes the weighted aggregates read exactly as the old
          # plain ones over a complete series.
          nulls=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT count(*) FILTER (WHERE dur_ms IS NULL) = count(*) FROM metrics_raw")
          echo "every pre-upgrade row has dur_ms IS NULL: $nulls"
          [ "$nulls" = "t" ]

          # #134 in place: the segmentby reached the already-compressed rollup
          # chunks rather than only future ones (TimescaleDB applies the setting
          # to future compressions and says so in a NOTICE, so a migration that
          # only ALTERs is silently a no-op for existing data).
          segmented=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc \
            "SELECT count(DISTINCT hypertable_name) FROM timescaledb_information.compression_settings
              WHERE attname IN ('metric','inverter_id') AND segmentby_column_index IS NOT NULL")
          echo "hypertables segmented by (metric, inverter_id): $segmented"
          [ "$segmented" -ge 7 ]

      - name: Assert server healthy after upgrade
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3000/healthz

      - name: Assert rollups intact
        run: |
          # A manual refresh, because the minute tier has no policy any more —
          # what is asserted is that the aggregate still MATERIALIZES from
          # upgraded raw rows, not that anything schedules it. The buckets a
          # deployment already holds keep answering reads while they decay, and
          # this is the proof they can still be produced at all.
          docker compose exec -T postgres psql -U postgres -d SunReye -c "CALL refresh_continuous_aggregate('minute_rollups', NULL, NULL);"
          rollups=$(docker compose exec -T postgres psql -U postgres -d SunReye -tAc "SELECT count(*) FROM minute_rollups")
          echo "rollup rows=$rollups"
          [ "$rollups" -gt 0 ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
