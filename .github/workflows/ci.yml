name: CI

on:
  push:
    # `dev` is the integration branch feature PRs land on; it is checked on
    # merge too, so a break that only shows up in the merge result is caught
    # before it reaches the release PR (or a beta addon build).
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This project reads and WRITES registers on grid-tied inverters and
  # batteries, so behaviour does not land without the test that proves it. The
  # gate is mechanical: source changed in the PR ⇒ a test changed with it. It
  # cannot check that the test came first, or that it covers the change — that
  # is review's job, and the coverage floor in the `test` job is the numeric
  # backstop. PR-only: the rule is about what a change adds, and `push` on an
  # integration branch has no meaningful base to diff against.
  tdd:
    name: Tests required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs the whole PR against its base, so the shallow default
          # is not enough.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Source changed without a test
        run: bun scripts/require-tests.ts ${{ github.event.pull_request.base.sha }}

  quality:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Dead code, duplication, complexity and architecture boundaries, per
      # .fallowrc.json (audit.gate is config-owned — do not pass --gate here).
      # Full-repo run rather than `fallow audit`: it needs no git history, so
      # the default fetch-depth: 1 above is enough and no stale base ref can
      # weaken it. Must stay after install — without node_modules fallow
      # degrades and reports findings that do not exist. Do not move this into
      # the `test` job: `test:coverage` leaves a parseable Istanbul file, which
      # relaxes CRAP scores for statically test-reachable functions.
      - name: Code health gate
        run: bunx fallow --quiet

      - name: Lint
        run: bunx oxlint

      - name: Format check
        run: bunx oxfmt --check

      - name: Type check
        run: bun run check-types

      # Every in-progress non-base locale must match en's keyset (missing/stale
      # keys fail). Empty locales (de/es/it/fr ship empty) are reported pending,
      # not failed — see apps/web/scripts/i18n-lint.ts.
      - name: i18n message lint
        working-directory: apps/web
        run: bun run i18n:lint

      # Production schema changes ship as committed, journaled migrations
      # (packages/db/src/migrations). Fail when the drizzle schema drifted from
      # the journal — i.e. someone changed src/schema without running
      # `bun run db:generate` — or when parallel branches collided in the journal.
      - name: Migration drift gate
        working-directory: packages/db
        run: |
          bunx drizzle-kit check
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Schema changed without a committed migration — run 'bun run db:generate' in packages/db and commit the result."
            git status --porcelain src/migrations
            exit 1
          fi

      - name: Build
        run: bun run build

  # The browser layer. Deliberately its own job rather than a step of `test`:
  # `bun run test` is the seconds-long unit run every commit waits on, and a
  # Chromium download plus a scroll sweep is neither. Nothing here needs the
  # engine, Postgres or an inverter — the backend is faked in the browser
  # (apps/web/e2e/support/api-mock.ts), so the job is a checkout, a browser and
  # `vite dev`.
  e2e:
    name: Browser tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Sharding: four independent runners, each executing a quarter of the specs
    # (`--shard=i/n`). Nothing in this layer holds cross-file state — the backend
    # is faked per page — so any split is valid, and wall time is the slowest
    # shard rather than the sum.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SKIP_ENV_VALIDATION: "1"
      # Pin the browser cache to a path the cache action can restore.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ~300 MB of Chrome for Testing. Keyed on the resolved Playwright version
      # so a bump re-downloads and anything else hits the cache.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: bun run e2e:install

      # Playwright transpiles TypeScript without checking it, and the browser
      # layer sits outside the SvelteKit tsconfig, so nothing else would.
      - name: Type check the browser layer
        run: bun run e2e:types

      - name: Browser tests
        run: bun run e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The database layer. Its own job rather than a step of `test`, for the same
  # reason `e2e` is: `bun run test` is the seconds-long run every commit waits
  # on, and pulling a TimescaleDB image is not. It also cannot share that job's
  # runner — these tests DROP and CREATE their own database.
  #
  # This layer exists because the unit suite asserts on the SQL a query builder
  # emits, which cannot say whether Postgres accepts it. Two 500s shipped behind
  # a fully green suite that way (an ambiguous `time_bucket` overload, and an
  # `ORDER BY` that bound to a UNION instead of its arm).
  db:
    name: Database query tests
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      # The harness derives its own scratch database from this and refuses to
      # touch any other, so the name here is only the connection target.
      DB_TEST_URL: postgresql://postgres:db-test@localhost:5432/postgres
    services:
      timescaledb:
        image: ghcr.io/sunreye/timescaledb:pg17-ts2.28.2
        env:
          POSTGRES_PASSWORD: db-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `scripts/fixture-1-2-0.ts` recovers the 1.2.0 schema from the
          # `addon-v1.2.0` TAG rather than transcribing it — `git show
          # addon-v1.2.0:packages/db/src/...`. A shallow checkout carries no
          # tags, so the fixture cannot be built and the upgrade specs fail in
          # CI while passing on every full clone.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite skips itself when no database is reachable — right locally, a
      # silent hole in CI. It throws instead when CI is set, so a broken service
      # container fails the job rather than quietly removing this layer.
      - name: Database query tests
        run: bun run test:db

  # The route layer. Its own job for the same reason `db` and `e2e` are theirs:
  # `bun run test` is the seconds-long run every commit waits on, and pulling a
  # TimescaleDB image, migrating it and letting a simulator record for twenty
  # seconds is not.
  #
  # It exists because nothing else covers a booted route. The unit suite stops
  # below `apps/server/src/routes/*`, the browser suite fakes the backend
  # entirely (no Elysia, no Postgres, no inverter), and the database suite proves
  # statements without the handlers that compose them — two 500s shipped through
  # that gap. This job boots the real server against a throwaway database and
  # asks every route in the OpenAPI listing whether it can answer at all. A 4xx
  # passes (the handler ran and refused the input); a 5xx, or no answer, fails.
  #
  # No service container: the harness starts and drops its own, so the job and a
  # developer's `bun run test:routes` run the SAME code path.
  routes:
    name: Route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke every route
        run: bun run test:routes

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # `scripts/fixture-1-2-0.ts` recovers the 1.2.0 schema from the
          # `addon-v1.2.0` TAG rather than transcribing it — `git show
          # addon-v1.2.0:packages/db/src/...`. A shallow checkout carries no
          # tags, so the fixture cannot be built and the upgrade specs fail in
          # CI while passing on every full clone.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A partial mock.module of a workspace module deletes the other exports
      # for every test file that runs after it, breaking them at import in an
      # order-dependent way — it passed locally and failed here.
      - name: Mock hygiene
        run: bun run test:mocks

      - name: Test with coverage
        run: bun run test:coverage

      # The ratchet. bun only colours its own coverageThreshold and still exits
      # 0, so the failing gate is this script, reading the lcov report above.
      - name: Coverage floor
        run: bun run test:floor

      - name: Generate coverage badge
        run: bun run coverage:badge

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p badge-publish
          cp coverage/coverage.svg badge-publish/coverage.svg
          cd badge-publish
          git init -q
          git checkout -q -b badges
          git add coverage.svg
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore: update coverage badge"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
