---
name: Weighted rollups

# The real-database gate for the time-weighted continuous aggregates (#116) and
# the rollup compression fix (#134). Both ship as ONE release, because each would
# otherwise require rebuilding a continuous aggregate separately.
#
# Everything here needs a live TimescaleDB, so none of it can live in `bun test`.
# What it proves, in order:
#
#   1. The safety property. With every `dur_ms` NULL the weighted mean is
#      *exactly* the legacy plain mean, per bucket, in all three tiers.
#   2. The bug is actually fixed. A mostly-idle signal with a short excursion,
#      stored completely and stored change-only, must produce the same weighted
#      average — while the UNWEIGHTED average of the change-only series is grossly
#      wrong. Both halves are asserted: a smooth fixture passes while broken.
#   3. No existing aggregate was recreated. The fixture holds 30 days of
#      materialized buckets against 7 days of surviving raw, so a re-materialize
#      could not possibly reproduce them — and every legacy bucket must come out
#      byte-identical.
#   4. The cutover has no gap and no double-counted bucket, and the weighted
#      source wins wherever it exists.
#   5. #134's read cost, measured before and after compression.
#   6. policies.sql stays idempotent across repeated migrate runs.
on:
  pull_request:
    paths:
      - "packages/db/**"
      - "apps/server/src/shared/rollup-sql.ts"
      - "apps/server/src/shared/history.ts"
      - "scripts/db-parity.ts"
      - ".github/workflows/db-weighted-rollups.yml"
  push:
    tags: ["server-v*", "addon-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-weighted-rollups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weighted:
    name: Weighted aggregates + rollup compression
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      PGPASSWORD: weighted-test
      PGHOST: localhost
      PGUSER: postgres
      LEGACY_URL: postgresql://postgres:weighted-test@localhost:5432/legacy
      FIXTURE_URL: postgresql://postgres:weighted-test@localhost:5432/fixture
      PERF_URL: postgresql://postgres:weighted-test@localhost:5432/perf
      MINUTE_URL: postgresql://postgres:weighted-test@localhost:5432/minute
      # The pre-migration TimescaleDB pipeline: the current tree minus the two
      # numbered files this release adds. Expressing "before" as a subtraction
      # from the real tree keeps it honest as the tree moves on.
      BASE_TIMESCALE_DIR: /tmp/timescale-before
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.2-pg17
        env:
          POSTGRES_PASSWORD: weighted-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # ---------------------------------------------------------------- 3 ----
      # A database that looks like an existing deployment: the legacy three
      # aggregates only, holding 30 days of buckets over 7 days of raw.
      - name: Bring up a pre-migration database
        run: |
          mkdir -p "$BASE_TIMESCALE_DIR"
          cp packages/db/src/timescale/*.sql "$BASE_TIMESCALE_DIR"/
          rm -f "$BASE_TIMESCALE_DIR/0002_weighted_rollups.sql" \
                "$BASE_TIMESCALE_DIR/0003_rollup_compression_segmentby.sql"
          ls -1 "$BASE_TIMESCALE_DIR"
          psql -d postgres -c "CREATE DATABASE legacy"
          # policies.sql is re-applied on every migrate run and now arms policies
          # for objects the withheld structural files create: the three weighted
          # aggregates, and compression on hourly_rollups / daily_rollups (which
          # had none before #134 — `add_compression_policy` on an aggregate with
          # no columnstore raises). Drop exactly those statements, so "before"
          # means the policy set as it stood, not a doctored one.
          python3 - "$BASE_TIMESCALE_DIR/policies.sql" <<'PY'
          import sys

          BREAK = "--> statement-breakpoint"
          path = sys.argv[1]
          statements = open(path).read().split(BREAK)


          def withheld(statement: str) -> bool:
              if "weighted_" in statement:
                  return True
              # Compression on the two tiers 0003 is what enables it for.
              return "compression_policy" in statement and (
                  "'hourly_rollups'" in statement or "'daily_rollups'" in statement
              )


          open(path, "w").write(BREAK.join(s for s in statements if not withheld(s)))
          PY
          DATABASE_URL="$LEGACY_URL" TIMESCALE_DIR="$BASE_TIMESCALE_DIR" \
            bun run --cwd packages/db db:migrate
          # Nothing weighted may exist yet, or the comparison proves nothing.
          missing=$(psql -d "$LEGACY_URL" -tAc \
            "SELECT count(*) FROM timescaledb_information.continuous_aggregates
              WHERE view_name LIKE 'weighted%'")
          echo "weighted aggregates before migration: $missing"
          [ "$missing" = "0" ]

      - name: Seed 30 days of buckets over 7 days of raw
        run: |
          # The destructive policies would otherwise race the fixture: retention
          # deletes chunks between the snapshot and the comparison, and the
          # compression job would move the compressed-chunk count under us.
          psql -d "$LEGACY_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT alter_job(job_id, scheduled => false) FROM timescaledb_information.jobs" \
            > /dev/null
          psql -d "$LEGACY_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- A deliberately lumpy signal: mostly idle with short excursions, the
          -- shape #116 says an unweighted mean handles worst.
          INSERT INTO metrics_raw (time, inverter_id, metric, value)
          SELECT t, inv, m,
                 CASE WHEN (extract(epoch FROM t)::bigint / 60) % 60 < 50 THEN 0
                      ELSE 3000 + (extract(epoch FROM t)::bigint % 977) END
          FROM generate_series(now() - INTERVAL '30 days', now(), INTERVAL '30 seconds') t,
               (VALUES ('inv1'),('inv2')) i(inv),
               (VALUES ('grid.import_power'),('battery.power')) mt(m);
          SQL
          for view in minute_rollups hourly_rollups daily_rollups; do
            psql -d "$LEGACY_URL" -v ON_ERROR_STOP=1 \
              -c "CALL refresh_continuous_aggregate('$view', NULL, NULL)"
          done
          # Simulate the 7-day retention policy having run. After this, the
          # pre-cutover buckets CANNOT be re-materialized from raw — which is the
          # whole reason a recreate is forbidden.
          psql -d "$LEGACY_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT drop_chunks('metrics_raw', older_than => INTERVAL '7 days')" > /dev/null
          psql -d "$LEGACY_URL" -tAc \
            "SELECT compress_chunk(c) FROM show_chunks('minute_rollups', older_than => INTERVAL '7 days') c" \
            > /dev/null
          psql -d "$LEGACY_URL" -tAc \
            "SELECT 'raw span', min(time), max(time), count(*) FROM metrics_raw"
          hourly=$(psql -d "$LEGACY_URL" -tAc "SELECT count(*) FROM hourly_rollups")
          echo "hourly buckets: $hourly"
          # 30 days of hourly buckets over 4 series is ~2880; 7 days would be ~672.
          [ "$hourly" -gt 2000 ]
          compressed=$(psql -d "$LEGACY_URL" -tAc \
            "SELECT count(*) FROM timescaledb_information.chunks WHERE is_compressed")
          echo "compressed chunks: $compressed"
          [ "$compressed" -gt 0 ]

      - name: Snapshot the pre-migration state
        run: |
          bun scripts/db-parity.ts --print-sql > /tmp/snapshot.sql
          psql -d "$LEGACY_URL" -tAf /tmp/snapshot.sql > /tmp/before.json
          test -s /tmp/before.json

      - name: Apply the migration for real
        run: |
          DATABASE_URL="$LEGACY_URL" bun run --cwd packages/db db:migrate
          psql -d "$LEGACY_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT alter_job(job_id, scheduled => false) FROM timescaledb_information.jobs" \
            > /dev/null
          for view in weighted_minute_rollups weighted_hourly_rollups weighted_daily_rollups; do
            psql -d "$LEGACY_URL" -v ON_ERROR_STOP=1 \
              -c "CALL refresh_continuous_aggregate('$view', NULL, NULL)"
          done
          psql -d "$LEGACY_URL" -tAc \
            "SELECT view_name, compression_enabled FROM timescaledb_information.continuous_aggregates ORDER BY 1"
          # Every rollup tier must now segment by metric first (#134).
          psql -d "$LEGACY_URL" -tAc \
            "SELECT a.view_name, string_agg(s.attname, ',' ORDER BY s.segmentby_column_index)
               FROM timescaledb_information.compression_settings s
               JOIN timescaledb_information.continuous_aggregates a
                 ON a.materialization_hypertable_name = s.hypertable_name
              WHERE s.segmentby_column_index IS NOT NULL
              GROUP BY 1 ORDER BY 1"
          unsegmented=$(psql -d "$LEGACY_URL" -tAc \
            "SELECT count(*) FROM timescaledb_information.continuous_aggregates a
              WHERE NOT EXISTS (
                SELECT 1 FROM timescaledb_information.compression_settings s
                 WHERE s.hypertable_name = a.materialization_hypertable_name
                   AND s.attname = 'metric' AND s.segmentby_column_index = 1)")
          echo "aggregates not segmented by metric: $unsegmented"
          [ "$unsegmented" = "0" ]

      # -------------------------------------------------------------- 1 + 3 ---
      - name: Every legacy bucket is identical, and every weighted bucket equals it
        run: |
          psql -d "$LEGACY_URL" -tAf /tmp/snapshot.sql > /tmp/after.json
          bun scripts/db-parity.ts /tmp/before.json /tmp/after.json \
            --expect-weighted-backfill --weighted-equals-legacy --require-data

      # ------------------------------------------------------------------ 2 ---
      - name: The weighting actually fixes the bug
        run: |
          psql -d postgres -c "CREATE DATABASE fixture"
          DATABASE_URL="$FIXTURE_URL" bun run --cwd packages/db db:migrate
          psql -d "$FIXTURE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT alter_job(job_id, scheduled => false) FROM timescaledb_information.jobs" > /dev/null
          psql -d "$FIXTURE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- 120 W idle for 50 minutes, then a varying excursion around 4 kW for 10.
          CREATE OR REPLACE FUNCTION sig(t timestamptz) RETURNS double precision AS $$
            SELECT CASE WHEN extract(minute FROM t) < 50 THEN 120
                        ELSE 3600 + (extract(epoch FROM t)::bigint % 977) END;
          $$ LANGUAGE sql IMMUTABLE;

          -- (a) complete: one sample every 3 s, each holding its value for 3000 ms.
          INSERT INTO metrics_raw (time, inverter_id, metric, value, dur_ms)
          SELECT t, 'complete', 'grid.import_power', sig(t), 3000
          FROM generate_series(timestamptz '2026-08-01 00:00:00+00',
                               timestamptz '2026-08-01 00:59:57+00', INTERVAL '3 seconds') t;

          -- (b) change-only: ONE row for the 50-minute idle stretch and 200 rows
          -- for the 10-minute excursion, each carrying its real held duration.
          -- That 1:200 ratio is exactly what breaks an unweighted mean.
          INSERT INTO metrics_raw (time, inverter_id, metric, value, dur_ms)
          SELECT t, 'changeonly', 'grid.import_power', sig(t),
                 CASE WHEN extract(minute FROM t) < 50 THEN 50 * 60 * 1000 ELSE 3000 END
          FROM generate_series(timestamptz '2026-08-01 00:00:00+00',
                               timestamptz '2026-08-01 00:59:57+00', INTERVAL '3 seconds') t
          WHERE extract(minute FROM t) >= 50 OR t = timestamptz '2026-08-01 00:00:00+00';
          SQL
          psql -d "$FIXTURE_URL" -c "CALL refresh_continuous_aggregate('hourly_rollups', NULL, NULL)"
          psql -d "$FIXTURE_URL" -c "CALL refresh_continuous_aggregate('weighted_hourly_rollups', NULL, NULL)"
          psql -d "$FIXTURE_URL" -c "
            SELECT h.inverter_id, count(*) OVER () AS series,
                   h.avg_value AS unweighted,
                   w.weighted_sum / nullif(w.weight, 0) AS weighted
              FROM hourly_rollups h JOIN weighted_hourly_rollups w USING (bucket, inverter_id, metric)
             ORDER BY 1"
          weighted_of() {
            psql -d "$FIXTURE_URL" -tAc \
              "SELECT weighted_sum / nullif(weight, 0) FROM weighted_hourly_rollups
                WHERE inverter_id = '$1'"
          }
          complete=$(weighted_of complete)
          changeonly=$(weighted_of changeonly)
          plain=$(psql -d "$FIXTURE_URL" -tAc \
            "SELECT avg_value FROM hourly_rollups WHERE inverter_id = 'changeonly'")
          echo "weighted(complete)=$complete weighted(change-only)=$changeonly unweighted(change-only)=$plain"
          # Within 0.5 %: the change-only series is a lossless re-encoding, so the
          # weighted means must agree.
          psql -d "$FIXTURE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN abs($changeonly - $complete) / $complete <= 0.005
                         THEN 'ok' ELSE 'FAIL' END" | grep -qx ok
          # …and the UNWEIGHTED mean of the same series must be grossly wrong, or
          # the fixture is too smooth to prove anything.
          psql -d "$FIXTURE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN $plain / $complete > 3 THEN 'ok' ELSE 'FAIL' END" | grep -qx ok

      - name: …and through the real read path, not only in SQL
        run: |
          DATABASE_URL="$FIXTURE_URL" bun -e '
            const { queryRollup } = await import("./apps/server/src/shared/history");
            const window = {
              bucket: "hour", metric: "grid.import_power",
              from: new Date("2026-08-01T00:00:00Z"), to: new Date("2026-08-01T01:00:00Z"),
              limit: 100,
            } as const;
            const complete = await queryRollup({ ...window, inverterId: "complete" });
            const changeOnly = await queryRollup({ ...window, inverterId: "changeonly" });
            console.log("complete  ", JSON.stringify(complete));
            console.log("changeonly", JSON.stringify(changeOnly));
            const a = complete[0]?.avg, b = changeOnly[0]?.avg;
            if (a === undefined || b === undefined) throw new Error("read path returned no bucket");
            const drift = Math.abs(b - a) / a;
            console.log("read-path drift:", drift);
            if (drift > 0.005) throw new Error(`read path drifted ${drift}`);
            // min/max are unaffected by weighting: an extreme is by definition a change.
            if (complete[0]?.max !== changeOnly[0]?.max) throw new Error("max drifted");
            if (complete[0]?.min !== changeOnly[0]?.min) throw new Error("min drifted");
            process.exit(0);
          '

      # ------------------------------------------------------------------ 4 ---
      - name: The cutover has no gap and no double-counted bucket
        run: |
          psql -d "$FIXTURE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Four consecutive hours of change-only data…
          INSERT INTO metrics_raw (time, inverter_id, metric, value, dur_ms)
          SELECT t, 'cut', 'grid.import_power', sig(t),
                 CASE WHEN extract(minute FROM t) < 50 THEN 50 * 60 * 1000 ELSE 3000 END
          FROM generate_series(timestamptz '2026-08-02 00:00:00+00',
                               timestamptz '2026-08-02 03:59:57+00', INTERVAL '3 seconds') t
          WHERE extract(minute FROM t) >= 50
             OR (extract(minute FROM t) = 0 AND extract(second FROM t) = 0);
          SQL
          # …materialized into the legacy aggregate over the whole span, but into
          # the weighted one over only the last two hours — the real situation,
          # where the weighted view cannot reach past the raw retention horizon.
          psql -d "$FIXTURE_URL" -c "CALL refresh_continuous_aggregate('hourly_rollups', timestamptz '2026-08-02 00:00:00+00', timestamptz '2026-08-02 04:00:00+00')"
          psql -d "$FIXTURE_URL" -c "CALL refresh_continuous_aggregate('weighted_hourly_rollups', timestamptz '2026-08-02 02:00:00+00', timestamptz '2026-08-02 04:00:00+00')"
          psql -d "$FIXTURE_URL" -c "
            SELECT 'legacy' AS side, bucket, avg_value FROM hourly_rollups
             WHERE inverter_id = 'cut'
            UNION ALL
            SELECT 'weighted', bucket, weighted_sum / nullif(weight, 0) FROM weighted_hourly_rollups
             WHERE inverter_id = 'cut'
            ORDER BY 2, 1"
          # A file under apps/server, not `bun -e` and not a file at the repo
          # root. Bun anchors a bare specifier at the nearest package.json, and
          # `@SunReye/db` and `drizzle-orm` are dependencies of apps/server — the
          # root package.json declares neither, so both forms fail to resolve
          # there. (The read-path step above gets away with a relative import
          # because ITS transitive `@SunReye/db` resolves from the imported file,
          # which does live under apps/server.)
          cat > apps/server/ci-cutover.ts <<'TS'
          import { queryRollup } from "./src/shared/history";
          import { db } from "@SunReye/db";
          import { sql } from "drizzle-orm";

          const rows = await queryRollup({
            bucket: "hour", metric: "grid.import_power", inverterId: "cut",
            from: new Date("2026-08-02T00:00:00Z"), to: new Date("2026-08-02T04:00:00Z"),
            limit: 100,
          });
          console.log(JSON.stringify(rows));
          if (rows.length !== 4) throw new Error(`expected 4 buckets, got ${rows.length}`);
          if (new Set(rows.map((r) => r.time)).size !== 4) throw new Error("a bucket was double-counted");
          const ms = rows.map((r) => Date.parse(r.time));
          for (let i = 1; i < ms.length; i++) {
            if (ms[i]! - ms[i - 1]! !== 3_600_000) throw new Error("the series is not contiguous");
          }
          // The two buckets the weighted view reaches must be served from it,
          // and the two it does not from the legacy view.
          const weighted = await db.execute<{ bucket: Date; avg: string }>(sql`
            select bucket, weighted_sum / nullif(weight, 0) as avg
            from weighted_hourly_rollups where inverter_id = ${"cut"} order by bucket`);
          const byBucket = new Map(
            weighted.rows.map((r) => [new Date(r.bucket).toISOString(), Number(r.avg)]),
          );
          if (byBucket.size !== 2) throw new Error(`fixture broken: ${byBucket.size} weighted buckets`);
          for (const row of rows) {
            const w = byBucket.get(row.time);
            if (w === undefined) {
              // Legacy side: an unweighted mean of this fixture is several times
              // the truth, so "not the weighted number" is easy to see.
              if (row.avg < 3000) throw new Error(`${row.time} should have come from the legacy view`);
            } else if (Math.abs(row.avg - w) > 1e-9) {
              throw new Error(`${row.time} did not come from the weighted view`);
            }
          }
          console.log("cutover: 4 contiguous buckets, weighted wins where it exists");
          process.exit(0);
          TS
          DATABASE_URL="$FIXTURE_URL" bun run apps/server/ci-cutover.ts
          rm -f apps/server/ci-cutover.ts

      # ------------------------------------------------------------------ 4b --
      # The minute tier is frozen (policies.sql): raw answers its buckets, and
      # the aggregates hold only what was materialized before the freeze. Two
      # claims, both of which have to hold for that to be lossless:
      #   * raw and the aggregate produce the SAME number for a bucket both
      #     cover — otherwise a chart's values would step at the freeze point;
      #   * a bucket whose raw rows have aged out is still answered, from the
      #     frozen aggregate — otherwise the decay window is a hole.
      - name: Minute buckets read identically from raw and from the frozen aggregate
        run: |
          psql -d postgres -c "CREATE DATABASE minute"
          DATABASE_URL="$MINUTE_URL" bun run --cwd packages/db db:migrate
          psql -d "$MINUTE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT alter_job(job_id, scheduled => false) FROM timescaledb_information.jobs" > /dev/null

          # No refresh policy may exist for either minute aggregate — the freeze
          # has to have reached the database, not just the file.
          armed=$(psql -d "$MINUTE_URL" -tAc \
            "SELECT count(*) FROM timescaledb_information.jobs
              WHERE proc_name = 'policy_refresh_continuous_aggregate'
                AND hypertable_name IN ('minute_rollups','weighted_minute_rollups')")
          echo "minute refresh policies armed: $armed"
          [ "$armed" = "0" ]

          psql -d "$MINUTE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Change-only traffic: long holds interleaved with short bursts, so an
          -- unweighted mean and a weighted one visibly disagree.
          INSERT INTO metrics_raw (time, inverter_id, metric, value, dur_ms)
          SELECT t, 'dev-1', 'battery.power',
                 CASE WHEN extract(second FROM t)::int % 7 = 0
                      THEN 3000 + (extract(epoch FROM t)::bigint % 401) ELSE 120 END,
                 CASE WHEN extract(second FROM t)::int % 7 = 0 THEN 1500 ELSE 8000 END
          FROM generate_series(timestamptz '2026-08-01 00:00:00+00',
                               timestamptz '2026-08-01 02:59:59+00', INTERVAL '5 seconds') t;
          SQL
          # Materialized by hand: this is what a deployment carries into the
          # freeze, and the only way to produce it now that no policy runs.
          psql -d "$MINUTE_URL" -c "CALL refresh_continuous_aggregate('weighted_minute_rollups', timestamptz '2026-08-01 00:00:00+00', timestamptz '2026-08-01 03:00:00+00')"

          cat > apps/server/ci-minute.ts <<'TS'
          import { queryRollup } from "./src/shared/history";
          import { db } from "@SunReye/db";
          import { sql } from "drizzle-orm";

          const base = {
            bucket: "minute", metric: "battery.power", inverterId: "dev-1",
            from: new Date("2026-08-01T00:00:00Z"), to: new Date("2026-08-01T03:00:00Z"),
            limit: 500,
          } as const;

          const before = await queryRollup({ ...base });
          const agg = await db.execute<{ bucket: string; v: number }>(sql`
            select bucket, weighted_sum / nullif(weight, 0) as v
            from weighted_minute_rollups
            where metric = 'battery.power' and inverter_id = 'dev-1' order by bucket`);
          const aggBy = new Map(agg.rows.map((r) => [new Date(r.bucket).toISOString(), Number(r.v)]));

          let worst = 0;
          for (const row of before) {
            const a = aggBy.get(row.time);
            if (a === undefined) throw new Error(`read path returned a bucket the aggregate lacks: ${row.time}`);
            worst = Math.max(worst, Math.abs(a - row.avg));
          }
          console.log(`buckets=${before.length} aggregate=${aggBy.size} worst_diff=${worst}`);
          if (before.length !== aggBy.size) throw new Error("bucket count differs");
          // Exactly, not within a tolerance: the raw arm computes the same two
          // sums the aggregate materialized, over the same rows.
          if (worst !== 0) throw new Error(`raw arm differs from the aggregate by ${worst}`);

          // Decay: the raw rows behind the first hour age out, leaving those
          // buckets only in the frozen aggregate. Every bucket must survive.
          await db.execute(sql`delete from metrics_raw where time < timestamptz '2026-08-01 01:00:00+00'`);
          const after = await queryRollup({ ...base });
          console.log(`after ageing out an hour of raw: buckets=${after.length}`);
          if (after.length !== before.length) {
            throw new Error(`lost ${before.length - after.length} buckets when raw aged out`);
          }
          let worstAfter = 0;
          for (const row of after) {
            worstAfter = Math.max(worstAfter, Math.abs((aggBy.get(row.time) ?? NaN) - row.avg));
          }
          console.log(`worst_diff_after=${worstAfter}`);
          if (worstAfter !== 0) throw new Error("the frozen aggregate answered with a different value");
          process.exit(0);
          TS
          DATABASE_URL="$MINUTE_URL" bun run apps/server/ci-minute.ts
          rm -f apps/server/ci-minute.ts

      # ------------------------------------------------------------------ 5 ---
      # #134's read cost. The issue's target is <= 200 buffers; the measured
      # floor on this schema is an order of magnitude above that (see the report
      # in the PR body), so what is gated here is the improvement actually
      # achieved — enough to catch a regression to the uncompressed shape, which
      # is what the fix is for. The numbers are printed either way.
      - name: A year of hourly buckets, one metric — buffers before and after
        run: |
          psql -d postgres -c "CREATE DATABASE perf"
          DATABASE_URL="$PERF_URL" bun run --cwd packages/db db:migrate
          psql -d "$PERF_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT alter_job(job_id, scheduled => false) FROM timescaledb_information.jobs" > /dev/null
          psql -d "$PERF_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO metrics_raw (time, inverter_id, metric, value, dur_ms)
          SELECT t, inv, 'metric_' || n, (extract(epoch FROM t)::bigint % 5000)::double precision, 3600000
          FROM generate_series(now() - INTERVAL '365 days', now(), INTERVAL '1 hour') t,
               (VALUES ('inv1'),('inv2')) i(inv),
               generate_series(1, 20) n;
          SQL
          psql -d "$PERF_URL" -c "CALL refresh_continuous_aggregate('hourly_rollups', NULL, NULL)"
          psql -d "$PERF_URL" -c "CALL refresh_continuous_aggregate('weighted_hourly_rollups', NULL, NULL)"

          # The outermost node's Buffers line is the total for the statement;
          # `hit` and `read` are summed because a cold read costs the same page.
          buffers() {
            psql -d "$PERF_URL" -tAc "
              EXPLAIN (ANALYZE, BUFFERS)
              SELECT bucket, avg_value, max_value, min_value FROM hourly_rollups
               WHERE metric = 'metric_7' AND inverter_id = 'inv1'
                 AND bucket >= now() - INTERVAL '365 days'
               ORDER BY bucket" \
              | awk '/Buffers: shared/ {
                       total = 0
                       for (i = 1; i <= NF; i++)
                         if ($i ~ /^(hit|read)=/) { split($i, kv, "="); total += kv[2] }
                       print total; exit }'
          }
          before=$(buffers)
          echo "buffers BEFORE compression: $before"

          psql -d "$PERF_URL" -tAc \
            "SELECT compress_chunk(c) FROM show_chunks('hourly_rollups', older_than => INTERVAL '7 days') c" > /dev/null
          psql -d "$PERF_URL" -tAc \
            "SELECT compress_chunk(c) FROM show_chunks('weighted_hourly_rollups', older_than => INTERVAL '7 days') c" > /dev/null
          after=$(buffers)
          echo "buffers AFTER  compression: $after"
          awk -v b="$before" -v a="$after" 'BEGIN { printf "improvement: %.2fx\n", b / a }'


          # The gate: compression must at least halve the buffers, and the
          # absolute figure must stay under a ceiling that the uncompressed shape
          # (measured ~7,500) cannot pass.
          [ "$after" -lt 4000 ]
          psql -d "$PERF_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN $before::numeric / $after >= 2 THEN 'ok' ELSE 'FAIL' END" | grep -qx ok

      # ------------------------------------------------------------------ 6 ---
      - name: policies.sql is idempotent across repeated migrate runs
        run: |
          jobs_of() {
            psql -d "$1" -tAc \
              "SELECT proc_name || ':' || coalesce(hypertable_name, '-') || ':' || coalesce(config::text, '-')
                 FROM timescaledb_information.jobs ORDER BY 1"
          }
          DATABASE_URL="$PERF_URL" bun run --cwd packages/db db:migrate > /dev/null
          jobs_of "$PERF_URL" > /tmp/jobs-1.txt
          DATABASE_URL="$PERF_URL" bun run --cwd packages/db db:migrate > /dev/null
          jobs_of "$PERF_URL" > /tmp/jobs-2.txt
          DATABASE_URL="$PERF_URL" bun run --cwd packages/db db:migrate > /dev/null
          jobs_of "$PERF_URL" > /tmp/jobs-3.txt
          wc -l /tmp/jobs-1.txt /tmp/jobs-2.txt /tmp/jobs-3.txt
          cat /tmp/jobs-3.txt
          diff /tmp/jobs-1.txt /tmp/jobs-2.txt
          diff /tmp/jobs-2.txt /tmp/jobs-3.txt
          # Every tier must actually be armed, or "unchanged" is unchanged-empty.
          for tier in minute_rollups hourly_rollups daily_rollups \
                      weighted_minute_rollups weighted_hourly_rollups weighted_daily_rollups; do
            grep -q "policy_refresh_continuous_aggregate:$tier:" /tmp/jobs-3.txt
            grep -q "policy_compression:$tier:" /tmp/jobs-3.txt
          done
