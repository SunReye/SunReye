name: sunreye

# Runs SunReye from the image published to GHCR by the CI pipeline — no local
# build. Copy .env.example to .env, fill in the secrets, then `docker compose up -d`.
#
# One image serves the dashboard, the REST API and the live socket, and runs the
# migrations: http://localhost:3000 is the whole app. (The dashboard is the
# hash-router build embedded in the binary, so routes read /#/statistics.)
#
# Pin a release by exporting SUNREYE_TAG (e.g. SUNREYE_TAG=v1.2.3) or leave it
# at "latest".

services:
  # One-shot schema migrator, run from the *server's own image*: src/main.ts
  # dispatches `migrate` to the journaled runner (downgrade guard, baseline
  # stamping for databases from the pre-journal `db:push` era, pending drizzle
  # migrations, TimescaleDB structural files, re-applied policies) and exits.
  #
  # It is deliberately the same image and the same tag as the server below: one
  # artifact means the schema can never be a different version from the code
  # that queries it. Safe on every `up` — applied migrations are skipped via the
  # journal tables, and the server waits for this to exit 0.
  migrate:
    image: ghcr.io/sunreye/sunreye-server:${SUNREYE_TAG:-latest}
    command: ["migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      # The migration runner only needs DATABASE_URL; skip the full server env
      # schema (auth secret, CORS, …) that isn't relevant here.
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/SunReye
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/sunreye/sunreye-server:${SUNREYE_TAG:-latest}
    init: true
    ports:
      - "${SERVER_PORT:-3000}:3000"
    # App configuration (auth secret, inverter host, MQTT, …) is read from .env.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # The site's own time zone. Every day, month and tariff-band boundary is
      # cut in the server's local clock, so a container left on UTC bills a
      # German evening peak to the following day and starts "this month" two
      # hours into the last one. Set TZ in .env to the household's zone.
      TZ: ${TZ:-UTC}
      # Always point at the bundled Postgres, regardless of what .env contains.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/SunReye
    # The image is scratch (no shell, no curl), so the server binary probes
    # itself: `--healthcheck` fetches /healthz (which round-trips the DB).
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    # Pinned (not latest-pg17): the datadir under the volume is only compatible
    # with the pg major it was created by, and the timescaledb extension binary
    # must be >= the extension version stamped in the database. Bump this tag
    # deliberately with a release, never implicitly.
    image: timescale/timescaledb:2.28.2-pg17
    # SSD-endurance tuning: cut the writes (TBW) a 1 Hz ingest makes.
    # synchronous_commit=off group-commits WAL (bounded <~0.5s crash-loss window
    # for telemetry — no corruption); wal_compression=zstd shrinks full-page
    # images harder than the pglz `on` default; a 2 h checkpoint_timeout writes
    # each hot page's image ~4x less often. full_page_writes stays ON. Additive `-c`
    # overrides — timescaledb's own config (shared_preload_libraries) is kept.
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - wal_compression=zstd
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=2h
    environment:
      POSTGRES_DB: SunReye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - sunreye_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sunreye_pg:
