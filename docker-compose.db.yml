name: sunreye-db

# Standalone TimescaleDB for local development (separate from the full-stack
# docker-compose.yml). Host networking is used so it also works with Docker
# inside an unprivileged Proxmox LXC, where bridged containers fail on the
# net.ipv4.ip_unprivileged_port_start sysctl. Reachable on localhost:5432,
# which matches apps/server/.env.

services:
  timescaledb:
    # Pinned to match the production compose files and the addon — see
    # docker-compose.yml. Built by docker/timescaledb/Dockerfile: it carries
    # timescaledb_toolkit, which timescale/timescaledb does not, and which the
    # baseline schema's weighted rollups need.
    image: ghcr.io/sunreye/timescaledb:pg17-ts2.28.2
    container_name: SunReye-timescaledb
    network_mode: host
    expose:
      - 5432
    # SSD-endurance tuning: cut the writes (TBW) a 1 Hz ingest makes.
    # synchronous_commit=off group-commits WAL (bounded <~0.5s crash-loss window
    # for telemetry — no corruption); wal_compression=zstd shrinks full-page
    # images harder than the pglz `on` default; wider checkpoint spacing means
    # fewer full-page writes. Additive `-c` overrides — timescaledb's own config
    # (shared_preload_libraries) is kept.
    #
    # Kept in step with the production compose files and the addon's generated
    # include on purpose: a dev database tuned differently from production is a
    # dev database that cannot reproduce a storage measurement.
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - wal_compression=zstd
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=2h
    environment:
      POSTGRES_DB: SunReye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - SunReye_timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

volumes:
  SunReye_timescale_data:
