name: SunReye

services:
  # One-shot schema migrator, run from the *server's own image*: src/main.ts
  # dispatches `migrate` to the journaled runner (downgrade guard, baseline
  # stamping for pre-journal databases, pending drizzle migrations, TimescaleDB
  # pipeline) and exits. One artifact means the schema can never be a different
  # version from the code that queries it.
  #
  # Safe on every `up` — applied migrations are skipped via the journal tables,
  # and the server waits for this to exit 0.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["migrate"]
    environment:
      # The runner only needs DATABASE_URL; skip the full server env schema
      # (auth secret, CORS, …) that isn't relevant here.
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/SunReye
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/SunReye
    # The image is scratch (no shell, no curl), so the server binary probes
    # itself: `--healthcheck` fetches /healthz (which round-trips the DB).
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    # Pinned (not latest-pg17): the datadir under the volume is only compatible
    # with the pg major it was created by, and the timescaledb extension binary
    # must be >= the extension version stamped in the database. Bump this tag
    # deliberately with a release, never implicitly.
    image: timescale/timescaledb:2.28.2-pg17
    container_name: SunReye-postgres
    # SSD-endurance tuning: cut the writes (TBW) a 1 Hz ingest makes.
    # synchronous_commit=off group-commits WAL (bounded <~0.5s crash-loss window
    # for telemetry — no corruption); wal_compression=zstd shrinks full-page
    # images harder than the pglz `on` default; a 2 h checkpoint_timeout writes
    # each hot page's image ~4x less often. full_page_writes stays ON. Additive `-c`
    # overrides — timescaledb's own config (shared_preload_libraries) is kept.
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - wal_compression=zstd
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=2h
    environment:
      POSTGRES_DB: SunReye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - SunReye_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  SunReye_postgres_data:
