[package]
name = "sunreye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sunreye"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
sunreye-profile.workspace = true
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "net",
  "rt",
  "sync",
  "time",
] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
