[package]
name = "sunreye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sunreye"
path = "src/main.rs"

[dependencies]
# HTTP routing (ADR 2); `tokio` for the client address, `json` for request bodies.
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
# Admin password hashes (ADR 9).
bcrypt = "0.19.3"
# Session tokens; bcrypt already depends on it.
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
sunreye-profile.workspace = true
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "net",
  "rt",
  "sync",
  "time",
] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
