[package]
name = "sunreye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sunreye"
path = "src/main.rs"

[dependencies]
# HTTP routing (ADR 2); `tokio` for the client address, `json` for request bodies, `query` for
# query strings, `http1` to serve.
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
# Admin password hashes (ADR 9).
bcrypt = "0.19.3"
# Builds the SSE stream; axum already depends on it.
futures-util = { version = "0.3.34", default-features = false }
# Session tokens; bcrypt already depends on it.
getrandom = "0.4.3"
# Plant-local days across DST; the bundled database serves hosts without one.
jiff = { version = "0.2.41", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
  "tzdb-concatenated",
  "tzdb-zoneinfo",
] }
# SHA-256 and Ed25519 verification of fetched profiles (ADR 8); rustls already depends on it.
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sunreye-profile.workspace = true
sunreye-pv.workspace = true
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
# Logs to stderr (ADR 2).
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The minimal HTTPS client on rustls (ADR 2): blocking, so a fetch runs on Tokio's blocking pool;
# an async client would add hyper, hyper-util and tokio-rustls for an hourly request.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
# The OpenAPI document generated from the Rust types (ADR 9); utoipa-axum registers each route
# with its description, so neither can drift from the other.
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
# The contract test reads the route a request matched.
axum = { version = "0.8.9", default-features = false, features = ["matched-path"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
