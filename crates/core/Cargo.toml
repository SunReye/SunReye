[package]
name = "sunreye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sunreye"
path = "src/main.rs"

[dependencies]
# HTTP routing (ADR 2); `tokio` for the client address, `json` for request bodies.
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
# Admin password hashes (ADR 9).
bcrypt = "0.19.3"
# Session tokens; bcrypt already depends on it.
getrandom = "0.4.3"
# Plant-local days across DST; the bundled database serves hosts without one.
jiff = { version = "0.2.41", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
  "tzdb-concatenated",
  "tzdb-zoneinfo",
] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sunreye-profile.workspace = true
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "net",
  "rt",
  "sync",
  "time",
] }
# The minimal HTTPS client on rustls (ADR 2): blocking, so a fetch runs on Tokio's blocking pool;
# an async client would add hyper, hyper-util and tokio-rustls for an hourly request.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
# The contract test reads the route a request matched.
axum = { version = "0.8.9", default-features = false, features = ["matched-path"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
