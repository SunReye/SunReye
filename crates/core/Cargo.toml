[package]
name = "sunreye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sunreye"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sunreye-profile.workspace = true
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "net",
  "rt",
  "sync",
  "time",
] }
# The minimal HTTPS client on rustls (ADR 2): blocking, so a fetch runs on Tokio's blocking pool;
# an async client would add hyper, hyper-util and tokio-rustls for an hourly request.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
