[package]
name = "sunreye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sunreye"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "net", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
