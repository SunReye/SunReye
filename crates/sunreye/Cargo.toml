[package]
name = "sunreye"
description = "SunReye core: polls devices, stores readings and serves the web app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
sqlx = { version = "0.8", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
thiserror = "2"
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-bundle-always",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
  "ansi",
] }
webpki-roots = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
  "ws",
] }
utoipa = "6"
utoipa-axum = "0.3"
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
axum-login = "0.18"
bcrypt = "0.19"
password-hash = { version = "0.5", default-features = false, features = ["getrandom"] }
tower-sessions = "0.14"
async-trait = "0.1"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
ring = { version = "0.17", default-features = false }

[lints]
workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sunreye-sim = { path = "../sim" }
tokio = { version = "1", default-features = false, features = [
  "io-util",
  "net",
  "rt-multi-thread",
  "test-util",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
