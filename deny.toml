[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Compatible with AGPL-3.0-only.
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list anticipates dependencies the skeleton does not have yet.
unused-allowed-license = "allow"
# Mozilla's root certificates as data, for the HTTPS client (ADR 2): a permissive data licence.
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the unpublished workspace crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
