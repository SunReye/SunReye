[install]
linker = "isolated"

[test]
# Root test runs from the repo root, so the per-app bunfig preload does not
# apply. Load the web test-setup (Paraglide localStorage stub) here too.
preload = ["./apps/web/src/test-setup.ts"]
# TDD floor, in bun's own summary metric (99.67 % funcs / 100.00 % lines when the
# suite was taken to full coverage). Note that bun only COLOURS the summary when a
# threshold is missed — it still exits 0 — so this is a reading aid. The gate that
# actually fails CI is `bun scripts/coverage-floor.ts`, which ratchets on the lcov
# report.
coverageThreshold = { line = 0.99, function = 0.98 }
coveragePathIgnorePatterns = [
  # The profile-SDK suite scaffolds real files under the OS temp dir and imports
  # them. They are fixtures, not code we ship, and their count varies per run —
  # which would make the coverage ratchet flap.
  "/tmp/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/*.test.ts",
  "**/paraglide/**",
]
